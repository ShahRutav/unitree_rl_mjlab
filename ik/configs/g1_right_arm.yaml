# IK config — G1 right arm (waist + right arm, 10 DOF)
#
# Solves for the right end-effector (right_wrist_yaw_link) using the
# waist and right arm joints.  Legs are frozen in a standing pose.
#
# Usage:
#   python ik/ik_runner.py ik/configs/g1_right_arm.yaml
#   python ik/ik_runner.py ik/configs/g1_right_arm.yaml --viewer
#   python ik/ik_runner.py ik/configs/g1_right_arm.yaml \
#       --target right_eef 0.45 -0.25 0.90

robot:
  xml: src/assets/robots/unitree_g1/xmls/g1.xml

  # Pelvis free-joint is placed at world origin so all targets are expressed
  # directly in the pelvis frame (pelvis = world origin).
  # Legs are pinned to the sitting pose during IK iterations;
  # mj_forward does NOT enforce equality constraints — must pin manually.
  freeze_legs: true
  frozen_leg_joints:
    left_hip_pitch_joint:   -1.5708   # -π/2  (thigh horizontal, sitting)
    left_hip_roll_joint:     0.0
    left_hip_yaw_joint:      0.0
    left_knee_joint:         1.2217   # 70°
    left_ankle_pitch_joint:  0.0
    left_ankle_roll_joint:   0.0
    right_hip_pitch_joint:  -1.5708
    right_hip_roll_joint:    0.0
    right_hip_yaw_joint:     0.0
    right_knee_joint:        1.2217
    right_ankle_pitch_joint: 0.0
    right_ankle_roll_joint:  0.0
    # waist_pitch_joint:       0.0
      # waist_roll_joint:        0.0

# ── Target frames ─────────────────────────────────────────────────────────────
# Each target names a body in the MuJoCo model and the desired world-frame pose.
#   position    — [x, y, z] in metres
#   orientation — [w, x, y, z] quaternion; omit to skip orientation control
#   pos_weight  — weight on position error (default 1.0)
#   ori_weight  — weight on orientation error (default 0.5)

targets:
  - name: right_eef
    body: right_wrist_yaw_link
    position: [0.4, -0.3, 0.8]
    orientation: [1.0, 0.0, 0.0, 0.0]   # identity — no rotation constraint
    pos_weight: 1.0
    ori_weight: 0.1

  # Offset frame: +3 cm X, +3 cm Z relative to right_eef body.
  # Change body here to update both IK target and visualizer tracking.
  - name: right_eef_offset
    body: right_eef_offset
    position: [0.43, -0.3, 0.83]        # placeholder; overridden at solve time
    pos_weight: 1.0
    ori_weight: 0.1

# ── Active joints & limits ────────────────────────────────────────────────────
# active : only these joints are updated by the IK solver.
# limits : per-joint software limits [lo_rad, hi_rad].
#   - Absent entry  → use the model's jnt_range (from the XML).
#   - null for one bound → fall back to the model value for that side only.
#   - Both bounds present → override the model limits entirely.
#   Config limits are applied as a hard clamp after every integration step.

joints:
  active:
    - waist_yaw_joint
    # - waist_roll_joint
      # - waist_pitch_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint

  # limits: uncomment and edit to narrow (or override) the model's joint ranges.
  # Values are in radians.  Use null for "keep model limit on this side".
  #
  limits:
    waist_yaw_joint:              [null, null]   # use full model range (±2.618 rad ≈ ±150°)
    waist_roll_joint:             [-0.2618, 0.2618]   # ±15 deg
    waist_pitch_joint:            [-0.2618, 0.2618]   # ±15 deg
    right_shoulder_pitch_joint:   [null, null]   # use model limits unchanged
    right_shoulder_roll_joint:    [null, null]
    right_shoulder_yaw_joint:     [null, null]
    right_elbow_joint:            [-0.3491, null]   # allow 20° of hyperextension; model floor is -60°
    right_wrist_roll_joint:       [null, null]
    right_wrist_pitch_joint:      [null, null]
    right_wrist_yaw_joint:        [null, null]

# ── Initial robot pose ────────────────────────────────────────────────────────
# base_pos  — free-joint xyz position (metres)
# base_quat — free-joint orientation, wxyz
# joints    — named joint angles (radians); unset joints default to 0

initial_pose:
  base_pos:  [0.0, 0.0, 0.0]   # pelvis at world origin → targets are pelvis-relative
  base_quat: [1.0, 0.0, 0.0, 0.0]
  joints:
    left_shoulder_pitch_joint:  0.35
    right_shoulder_pitch_joint: 0.35
    left_shoulder_roll_joint:   0.18
    right_shoulder_roll_joint: -0.18
    left_elbow_joint:   0.87
    right_elbow_joint:  0.87

# ── Solver hyperparameters ───────────────────────────────────────────────────
solver:
  max_iter:  200
  tolerance: 1.0e-3   # converge when max position error < this (metres)
  damping:   0.05     # DLS damping factor (λ); higher = smoother, less agile
  max_dq:    0.5      # per-step joint delta clamp (rad)
