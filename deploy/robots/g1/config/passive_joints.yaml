# Joints to set kp=0, kd=0 (fully passive/limp).
# Applied on top of gains in joint_cmd.yaml (JointCmd state) and config.yaml (FixSit state).
# Joint order: left_leg(6) right_leg(6) waist(3) left_arm(7) right_arm(7)
#
#  0  L_hip_pitch      <-- kept active
#  1  L_hip_roll
#  2  L_hip_yaw
#  3  L_knee
#  4  L_ankle_pitch
#  5  L_ankle_roll
#  6  R_hip_pitch      <-- kept active
#  7  R_hip_roll
#  8  R_hip_yaw
#  9  R_knee
# 10  R_ankle_pitch
# 11  R_ankle_roll

passive_joints: [
  1,   # L_hip_roll
  2,   # L_hip_yaw
  3,   # L_knee
  4,   # L_ankle_pitch
  5,   # L_ankle_roll
  7,   # R_hip_roll
  8,   # R_hip_yaw
  9,   # R_knee
  10,  # R_ankle_pitch
  11,  # R_ankle_roll
  13,  # waist_roll   (physically locked)
  14,  # waist_pitch  (physically locked)
  15,  # L_shoulder_pitch
  16,  # L_shoulder_roll
  17,  # L_shoulder_yaw
  18,  # L_elbow
  19,  # L_wrist_roll
  20,  # L_wrist_pitch
  21,  # L_wrist_yaw
]
