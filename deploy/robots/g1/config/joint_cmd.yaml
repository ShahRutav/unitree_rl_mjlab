# JointCmd state configuration
# All parameters specific to State_JointCmd live here.

# ---------- ZMQ subscriber ----------
zmq_address: "tcp://localhost:5555"

# ---------- ZMQ feedback publisher (arm_cmd.py reads q_current here) ----------
enable_feedback_pub: true          # publish q_current + q_target for arm_cmd gravity comp
zmq_feedback_address: "tcp://*:5556"
feedback_decimation: 5             # publish every N ticks (5 = 200 Hz at 1 kHz FSM)

# ---------- ZMQ plot publisher (plot_joint_error.py reads here) ----------
zmq_plot_address: "tcp://*:5558"   # dedicated port for plot_joint_error.py
zmq_rcvtimeo_ms: 100     # ZMQ receive timeout (ms); used by the background thread
                          # for clean shutdown — lower = faster exit, higher = less CPU wakeup
zmq_poll_sleep_ms: 1     # sleep between non-blocking polls (ms); keeps CPU usage low
                          # while still reacting to new commands quickly

# ---------- debug ----------
disable_discard: false   # set to true to skip all DISCARD checks — every command becomes
                          # DIRECT or INTERPOLATE; useful when debugging pose mismatches
disable_interp:  false    # set to true to skip interpolation — commands go directly to target
                          # regardless of error magnitude; use with caution on hardware

# ---------- safety thresholds ----------
threshold_direct: 0.2618         # max L-inf error (rad) below which we send directly (~15°)
threshold_discard_indiv: 3.1416  # discard if any single joint error > this (rad, default π = 180°)
threshold_discard_sum:   6.2832  # discard if sum(|err|) across all joints > this (rad, default 2π = 360°)
                                  # commands not discarded and outside threshold_direct are interpolated
interp_duration: 2.0             # time (s) to interpolate from current to target

# ---------- default hold pose (sent until the first ZMQ command arrives) ----------
# Matches the FixSit pose:
#   legs: hip_pitch=-π/2 ≈ -1.5708, knee=70° ≈ 1.2217, everything else 0
#   arms: shoulder_pitch=0.35 (20°), shoulder_roll=±0.4363 (25°), elbow=0.87 (50°)
# Order: left_leg(6) right_leg(6) waist(3) left_arm(7) right_arm(7)
q_default: [
  -1.5708, 0.0, 0.0,  1.2217, 0.0, 0.0,   # left leg  (hip_pitch=-π/2, knee=70°)
  -1.5708, 0.0, 0.0,  1.2217, 0.0, 0.0,   # right leg
   0.0, 0.0, 0.0,                          # waist
   0.35, 0.4363, 0.0, 0.87, 0.0, 0.0, 0.0,  # left arm  (matches FixSit: shoulder_pitch=20°, shoulder_roll=25°, elbow=50°)
   0.35,-0.4363, 0.0, 0.87, 0.0, 0.0, 0.0, # right arm (matches FixSit: shoulder_pitch=20°, shoulder_roll=-25°, elbow=50°)
]

# ---------- PD gains (29 DOF: left-leg, right-leg, waist, left-arm, right-arm) ----------
kp: [
  100, 100, 100, 150, 40, 40,
  100, 100, 100, 150, 40, 40,
  400, 400, 400,
  40, 40, 40, 40, 40, 40, 40,
  80, 80, 80, 80, 80, 80, 80,
]
kd: [
  2, 2, 2, 4, 2, 2,
  2, 2, 2, 4, 2, 2,
  5, 5, 5,
  10, 10, 10, 10, 10, 10, 10,
  10, 10, 10, 10, 10, 10, 10,
]
