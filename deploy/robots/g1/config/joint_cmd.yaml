# JointCmd state configuration
# All parameters specific to State_JointCmd live here.

# ---------- ZMQ subscriber ----------
zmq_address: "tcp://localhost:5555"

# ---------- ZMQ feedback publisher (arm_cmd.py reads q_current here) ----------
enable_feedback_pub: true          # publish q_current + q_target for arm_cmd gravity comp
zmq_feedback_address: "tcp://*:5556"
feedback_decimation: 5             # publish every N ticks (5 = 200 Hz at 1 kHz FSM)

# ---------- ZMQ plot publisher (plot_joint_error.py reads here) ----------
zmq_plot_address: "tcp://*:5558"   # dedicated port for plot_joint_error.py
zmq_rcvtimeo_ms: 100     # ZMQ receive timeout (ms); used by the background thread
                          # for clean shutdown — lower = faster exit, higher = less CPU wakeup
zmq_poll_sleep_ms: 1     # sleep between non-blocking polls (ms); keeps CPU usage low
                          # while still reacting to new commands quickly

# ---------- gravity compensation ----------
gravity_comp: true            # set to false to disable model-based gravity compensation
                              # (can also be enabled per-run with --gravity-comp CLI flag)

# ---------- debug ----------
disable_discard: false   # set to true to skip all DISCARD checks — every command becomes
                          # DIRECT or INTERPOLATE; useful when debugging pose mismatches
disable_interp:  false    # set to true to skip interpolation — commands go directly to target
                          # regardless of error magnitude; use with caution on hardware

# ---------- safety thresholds ----------
threshold_direct: 0.2618             # max L-inf error (rad) below which we send directly (~5.7°)
threshold_discard_indiv: 3.1416  # discard if any single joint error > this (rad, default π = 180°)
threshold_discard_sum:   9.4248  # discard if sum(|err|) across all joints > this (rad, 3π = 540°)
                                  # commands not discarded and outside threshold_direct are interpolated
interp_duration: 0.5             # minimum interpolation time (s); adaptive T extends this when needed

# ---------- velocity feedforward ----------
# Sender's expected publish rate (Hz). Used to compute dq_des feedforward as
#   dq_ff = (q_new - q_policy_prev) / (1 / policy_hz)
# which removes the Kd-term braking that otherwise fights motion between policy
# ticks (the q_des staircase). Must match the actual sender rate; if messages
# stop arriving, dq_ff is zeroed after 1.5 * policy_dt to avoid steady drift.
policy_hz: 10

# ---------- default hold pose (sent until the first ZMQ command arrives) ----------
# Matches the FixSit pose:
#   legs: hip_pitch=-π/2 ≈ -1.5708, knee=70° ≈ 1.2217, everything else 0
#   arms: shoulder_pitch=0.35 (20°), shoulder_roll=±0.4363 (25°), elbow=0.87 (50°)
# Order: left_leg(6) right_leg(6) waist(3) left_arm(7) right_arm(7)
q_default: [
  -1.3963, 0.0, 0.0,  1.2217, 0.0, 0.0,   # left leg  (hip_pitch=-100°, knee=70°)
  -1.3963, 0.0, 0.0,  1.2217, 0.0, 0.0,   # right leg (hip_pitch=-100°, knee=70°)
   0.0, 0.0, 0.0,                          # waist
   0.35, 0.4363, 0.0, 0.87, 0.0, 0.0, 0.0,  # left arm  (matches FixSit: shoulder_pitch=20°, shoulder_roll=25°, elbow=50°)
   0.6,-0.4363,-0.3491, 0.87, 0.0, 0.0, 0.0, # right arm (shoulder_pitch=~34°, shoulder_roll=-25°, shoulder_yaw=-20°, elbow=50°)
]

# ---------- locked joints (index: value, rad) ----------
# These joints are pinned at the given value every tick — both in joint_cmd (C++)
# and in arm_cmd.py. They are also excluded from the DIRECT/INTERPOLATE/DISCARD
# classification so passive-joint drift never triggers a ramp on them.
locked_joints:
  0:  -1.3963   # L_hip_pitch  (-100°)
  6:  -1.3963   # R_hip_pitch  (-100°)

# ---------- per-joint torque clamp (Nm) ----------
# arm_cmd.py clips q_sent so kp[i]*|q_sent[i]-q_current[i]| <= max_torque[i].
# Values match g1_sitting.xml ctrlrange. Remove or set to [] to disable.
max_torque: [
  # [0-5]   left leg:  hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  88, 139, 88, 139, 50, 50,
  # [6-11]  right leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  88, 139, 88, 139, 25, 25,
  # [12-14] waist:     yaw, roll, pitch
  88, 20, 20,
  # [15-21] left arm:  shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
  20, 20, 20, 5, 3, 3, 3,
  # [22-28] right arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
  20, 20, 20, 5, 3, 3, 3,
]

# ---------- PD gains (29 DOF: left-leg, right-leg, waist, left-arm, right-arm) ----------
kp: [
  # [0-5]   left leg:  hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  400, 100, 100, 150, 40, 40,
  # [6-11]  right leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  400, 100, 100, 150, 40, 40,
  # [12-14] waist:     yaw, roll, pitch
  400, 400, 400,
  # [15-21] left arm:  shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
  40, 40, 40, 40, 40, 40, 40,
  # [22-28] right arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
  80, 80, 80, 80, 80, 80, 80,
]
kd: [
  # [0-5]   left leg:  hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  2, 2, 2, 4, 2, 2,
  # [6-11]  right leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
  2, 2, 2, 4, 2, 2,
  # [12-14] waist:     yaw, roll, pitch
  5, 5, 5,
  # [15-21] left arm:  shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
  10, 10, 10, 10, 10, 10, 10,
  # [22-28] right arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
  5, 5, 5, 5, 10, 10, 10,
]
